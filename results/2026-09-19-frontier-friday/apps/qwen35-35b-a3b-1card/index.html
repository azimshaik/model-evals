<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Inventory Manager</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --border: #e5e7eb;
            --radius: 8px;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 { margin: 0; font-size: 1.5rem; }
        h2 { font-size: 1.25rem; margin-top: 0; }

        /* Buttons */
        button {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: var(--radius);
            border: 1px solid transparent;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        
        .btn-secondary { background-color: white; border-color: var(--border); color: var(--text); }
        .btn-secondary:hover { background-color: var(--bg); }

        .btn-danger { background-color: white; border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger); color: white; }

        .btn-sm { padding: 4px 8px; font-size: 0.8rem; }

        /* Layout */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: 1fr 2fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        /* Forms */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem; }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Inventory List */
        .inventory-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.1s;
        }

        .item-card:hover { border-color: #d1d5db; }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item-title { font-weight: 600; font-size: 1.1rem; }
        .item-meta { font-size: 0.85rem; color: var(--text-light); display: flex; gap: 10px; flex-wrap: wrap; }
        .item-notes { font-size: 0.9rem; color: var(--text); margin-top: 5px; }
        
        .item-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 5px;
        }

        /* Low Stock Indicator */
        .low-stock {
            border-left: 4px solid var(--warning);
            background-color: #fffbeb;
        }
        .low-stock .item-title { color: #92400e; }

        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: var(--radius);
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        /* Utilities */
        .hidden { display: none !important; }
        .text-right { text-align: right; }
        .flex-row { display: flex; gap: 10px; align-items: flex-end; }
        .flex-row > * { flex: 1; }
        
        .room-badge {
            background: #e0e7ff;
            color: #3730a3;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        
        .category-badge {
            background: #f3f4f6;
            color: #4b5563;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏠 Home Inventory</h1>
        <div>
            <button class="btn-secondary btn-sm" onclick="app.loadDemoData()">Load Demo</button>
            <button class="btn-secondary btn-sm" onclick="document.getElementById('fileInput').click()">Import JSON</button>
            <button class="btn-secondary btn-sm" onclick="app.exportData()">Export JSON</button>
            <input type="file" id="fileInput" class="hidden" accept=".json" onchange="app.importData(this)">
        </div>
    </header>

    <div class="grid">
        <!-- Sidebar: Rooms & Filters -->
        <aside>
            <!-- Room Management -->
            <div class="card">
                <h2>Rooms</h2>
                <div class="form-group">
                    <input type="text" id="newRoomName" placeholder="New Room Name (e.g. Garage)">
                </div>
                <div class="flex-row">
                    <button class="btn-primary" style="width: 100%" onclick="app.addRoom()">Add Room</button>
                </div>
                <ul id="roomList" style="list-style: none; padding: 0; margin-top: 15px;">
                    <!-- Rooms injected here -->
                </ul>
            </div>

            <!-- Filters -->
            <div class="card">
                <h2>Filters</h2>
                <div class="form-group">
                    <input type="text" id="searchInput" placeholder="Search items..." oninput="app.renderInventory()">
                </div>
                <div class="form-group">
                    <select id="filterRoom" onchange="app.renderInventory()">
                        <option value="all">All Rooms</option>
                    </select>
                </div>
                <div class="form-group">
                    <select id="filterCategory" onchange="app.renderInventory()">
                        <option value="all">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Tools">Tools</option>
                        <option value="Documents">Documents</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Cleaning">Cleaning</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- Main: Inventory & Add Item -->
        <main>
            <!-- Add/Edit Item Form -->
            <div class="card">
                <h2 id="formTitle">Add New Item</h2>
                <form id="itemForm" onsubmit="app.handleFormSubmit(event)">
                    <input type="hidden" id="itemId">
                    <div class="flex-row">
                        <div>
                            <label for="itemName">Name</label>
                            <input type="text" id="itemName" required>
                        </div>
                        <div style="max-width: 80px;">
                            <label for="itemQty">Qty</label>
                            <input type="number" id="itemQty" min="1" value="1" required>
                        </div>
                    </div>
                    
                    <div class="flex-row">
                        <div>
                            <label for="itemRoom">Room</label>
                            <select id="itemRoom" required>
                                <option value="">Select Room</option>
                            </select>
                        </div>
                        <div>
                            <label for="itemCategory">Category</label>
                            <select id="itemCategory" required>
                                <option value="Food">Food</option>
                                <option value="Tools">Tools</option>
                                <option value="Documents">Documents</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Cleaning">Cleaning</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="itemNotes">Notes (Optional)</label>
                        <textarea id="itemNotes" rows="2" placeholder="Expiry date, brand, location..."></textarea>
                    </div>

                    <div class="text-right">
                        <button type="button" class="btn-secondary" onclick="app.resetForm()" style="margin-right: 10px;">Cancel</button>
                        <button type="submit" class="btn-primary">Save Item</button>
                    </div>
                </form>
            </div>

            <!-- Inventory List -->
            <div class="card">
                <h2>Inventory</h2>
                <div id="emptyState" class="text-right" style="padding: 20px; color: var(--text-light);">
                    No items found. Add one above!
                </div>
                <ul id="inventoryList" class="inventory-list">
                    <!-- Items injected here -->
                </ul>
            </div>
        </main>
    </div>
</div>

<div id="toast">Action Successful</div>

<script>
/**
 * Home Inventory Manager Application Logic
 */
const app = {
    data: {
        rooms: [],
        items: []
    },
    
    // Constants
    CATEGORIES: ['Food', 'Tools', 'Documents', 'Electronics', 'Cleaning', 'Other'],
    STORAGE_KEY: 'home_inventory_data_v1',

    init() {
        this.loadData();
        this.renderRooms();
        this.updateRoomSelects();
        this.renderInventory();
    },

    // --- Data Management ---

    loadData() {
        const stored = localStorage.getItem(this.STORAGE_KEY);
        if (stored) {
            try {
                this.data = JSON.parse(stored);
            } catch (e) {
                console.error("Failed to parse local storage", e);
                this.data = { rooms: [], items: [] };
            }
        }
    },

    saveData() {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.data));
    },

    // --- Rooms ---

    addRoom() {
        const input = document.getElementById('newRoomName');
        const name = input.value.trim();
        if (!name) return;

        if (this.data.rooms.includes(name)) {
            this.showToast("Room already exists");
            return;
        }

        this.data.rooms.push(name);
        this.data.rooms.sort(); // Keep sorted
        this.saveData();
        this.renderRooms();
        this.updateRoomSelects();
        input.value = '';
        this.showToast(`Room "${name}" added`);
    },

    deleteRoom(roomName) {
        if (!confirm(`Delete room "${roomName}"? Items in this room will remain but lose their room assignment.`)) return;

        this.data.rooms = this.data.rooms.filter(r => r !== roomName);
        // Remove room assignment from items
        this.data.items.forEach(item => {
            if (item.room === roomName) item.room = '';
        });

        this.saveData();
        this.renderRooms();
        this.updateRoomSelects();
        this.renderInventory();
        this.showToast("Room deleted");
    },

    renderRooms() {
        const list = document.getElementById('roomList');
        list.innerHTML = '';
        
        if (this.data.rooms.length === 0) {
            list.innerHTML = '<li style="color:var(--text-light); font-style:italic;">No rooms added yet.</li>';
            return;
        }

        this.data.rooms.forEach(room => {
            const li = document.createElement('li');
            li.style.display = 'flex';
            li.style.justifyContent = 'space-between';
            li.style.alignItems = 'center';
            li.style.padding = '8px 0';
            li.style.borderBottom = '1px solid var(--border)';

            const span = document.createElement('span');
            span.textContent = room;

            const btn = document.createElement('button');
            btn.textContent = 'Delete';
            btn.className = 'btn-danger btn-sm';
            btn.onclick = () => this.deleteRoom(room);

            li.appendChild(span);
            li.appendChild(btn);
            list.appendChild(li);
        });
    },

    updateRoomSelects() {
        // Update Add Item Form
        const formSelect = document.getElementById('itemRoom');
        const currentVal = formSelect.value;
        formSelect.innerHTML = '<option value="">Select Room</option>';
        
        // Update Filter
        const filterSelect = document.getElementById('filterRoom');
        const filterVal = filterSelect.value;
        filterSelect.innerHTML = '<option value="all">All Rooms</option>';

        this.data.rooms.forEach(room => {
            // Form
            const opt1 = document.createElement('option');
            opt1.value = room;
            opt1.textContent = room;
            formSelect.appendChild(opt1);

            // Filter
            const opt2 = document.createElement('option');
            opt2.value = room;
            opt2.textContent = room;
            filterSelect.appendChild(opt2);
        });

        // Restore values if they still exist
        if (this.data.rooms.includes(currentVal)) formSelect.value = currentVal;
        if (filterVal !== 'all' && this.data.rooms.includes(filterVal)) filterSelect.value = filterVal;
    },

    // --- Items ---

    handleFormSubmit(e) {
        e.preventDefault();
        
        const id = document.getElementById('itemId').value;
        const name = document.getElementById('itemName').value.trim();
        const qty = parseInt(document.getElementById('itemQty').value);
        const room = document.getElementById('itemRoom').value;
        const category = document.getElementById('itemCategory').value;
        const notes = document.getElementById('itemNotes').value.trim();

        if (!name || !room) {
            this.showToast("Name and Room are required");
            return;
        }

        if (id) {
            // Edit existing
            const index = this.data.items.findIndex(i => i.id == id);
            if (index > -1) {
                this.data.items[index] = { ...this.data.items[index], name, qty, room, category, notes };
                this.showToast("Item updated");
            }
        } else {
            // Create new
            const newItem = {
                id: Date.now().toString(),
                name,
                qty,
                room,
                category,
                notes
            };
            this.data.items.push(newItem);
            this.showToast("Item added");
        }

        this.saveData();
        this.resetForm();
        this.renderInventory();
    },

    editItem(id) {
        const item = this.data.items.find(i => i.id === id);
        if (!item) return;

        document.getElementById('itemId').value = item.id;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemQty').value = item.qty;
        document.getElementById('itemRoom').value = item.room;
        document.getElementById('itemCategory').value = item.category;
        document.getElementById('itemNotes').value = item.notes;

        document.getElementById('formTitle').textContent = "Edit Item";
        document.getElementById('itemForm').scrollIntoView({ behavior: 'smooth' });
    },

    deleteItem(id) {
        if (!confirm("Are you sure you want to delete this item?")) return;
        
        this.data.items = this.data.items.filter(i => i.id !== id);
        this.saveData();
        this.renderInventory();
        this.showToast("Item deleted");
    },

    resetForm() {
        document.getElementById('itemForm').reset();
        document.getElementById('itemId').value = '';
        document.getElementById('formTitle').textContent = "Add New Item";
    },

    renderInventory() {
        const listEl = document.getElementById('inventoryList');
        const emptyEl = document.getElementById('emptyState');
        
        const search = document.getElementById('searchInput').value.toLowerCase();
        const filterRoom = document.getElementById('filterRoom').value;
        const filterCat = document.getElementById('filterCategory').value;

        // Filter Logic
        let filtered = this.data.items.filter(item => {
            const matchesSearch = item.name.toLowerCase().includes(search) || 
                                  (item.notes && item.notes.toLowerCase().includes(search));
            const matchesRoom = filterRoom === 'all' || item.room === filterRoom;
            const matchesCat = filterCat === 'all' || item.category === filterCat;
            return matchesSearch && matchesRoom && matchesCat;
        });

        // Sort: Low stock first, then by name
        filtered.sort((a, b) => {
            if (a.qty <= 2 && b.qty > 2) return -1;
            if (a.qty > 2 && b.qty <= 2) return 1;
            return a.name.localeCompare(b.name);
        });

        listEl.innerHTML = '';

        if (filtered.length === 0) {
            emptyEl.classList.remove('hidden');
        } else {
            emptyEl.classList.add('hidden');
            filtered.forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-card';
                if (item.qty <= 2) li.classList.add('low-stock');

                li.innerHTML = `
                    <div class="item-header">
                        <div>
                            <div class="item-title">${this.escapeHtml(item.name)}</div>
                            <div class="item-meta">
                                <span class="room-badge">${this.escapeHtml(item.room)}</span>
                                <span class="category-badge">${this.escapeHtml(item.category)}</span>
                                <span>Qty: <strong>${item.qty}</strong></span>
                            </div>
                        </div>
                    </div>
                    ${item.notes ? `<div class="item-notes">${this.escapeHtml(item.notes)}</div>` : ''}
                    <div class="item-actions">
                        <button class="btn-secondary btn-sm" onclick="app.editItem('${item.id}')">Edit</button>
                        <button class="btn-danger btn-sm" onclick="app.deleteItem('${item.id}')">Delete</button>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }
    },

    // --- Utilities ---

    showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    },

    escapeHtml(text) {
        if (!text) return text;
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    },

    // --- Import / Export / Demo ---

    exportData() {
        const dataStr = JSON.stringify(this.data, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `inventory_export_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        this.showToast("Data exported successfully");
    },

    importData(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const json = JSON.parse(e.target.result);
                if (json.rooms && json.items) {
                    this.data = json;
                    this.saveData();
                    this.renderRooms();
                    this.updateRoomSelects();
                    this.renderInventory();
                    this.showToast("Data imported successfully");
                } else {
                    throw new Error("Invalid format");
                }
            } catch (err) {
                alert("Error importing file. Please ensure it is a valid JSON export.");
            }
        };
        reader.readAsText(file);
        input.value = ''; // Reset input
    },

    loadDemoData() {
        if (!confirm("This will overwrite your current data with demo data. Continue?")) return;

        this.data = {
            rooms: ["Kitchen", "Garage", "Living Room", "Bedroom"],
            items: [
                { id: "1", name: "Duct Tape", qty: 1, room: "Garage", category: "Tools", notes: "Silver, 2 inch" },
                { id: "2", name: "First Aid Kit", qty: 1, room: "Kitchen", category: "Other", notes: "Check expiry annually" },
                { id: "3", name: "Screwdriver Set", qty: 1, room: "Garage", category: "Tools", notes: "Phillips and Flathead" },
                { id: "4", name: "Batteries (AA)", qty: 4, room: "Living Room", category: "Electronics", notes: "" },
                { id: "5", name: "Cleaning Spray", qty: 1, room: "Kitchen", category: "Cleaning", notes: "" },
                { id: "6", name: "Wrench", qty: 1, room: "Garage", category: "Tools", notes: "10 inch" },
                { id: "7", name: "Extension Cord", qty: 1, room: "Garage", category: "Electronics", notes: "25ft" },
                { id: "8", name: "Flashlight", qty: 1, room: "Bedroom", category: "Electronics", notes: "Batteries included" },
                { id: "9", name: "Paperclips", qty: 2, room: "Living Room", category: "Documents", notes: "Box of 100" },
                { id: "10", name: "Stapler", qty: 1, room: "Living Room", category: "Documents", notes: "" }
            ]
        };
        this.saveData();
        this.renderRooms();
        this.updateRoomSelects();
        this.renderInventory();
        this.showToast("Demo data loaded");
    }
};

// Initialize App
document.addEventListener('DOMContentLoaded', () => {
    app.init();
});

</script>
</body>
</html>
